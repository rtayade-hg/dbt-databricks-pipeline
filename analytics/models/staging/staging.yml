version: 2

models:
  - name: stg_job_postings
    description: "Cleaned and enriched job postings with normalized salary and job extension fields."
    columns:
      - name: job_id
        description: "Unique identifier for the job posting."
        data_tests:
          - not_null
      - name: job_title
        description: "Title of the job posting."
      - name: company_name
        description: "Company offering the job."
      - name: job_location
        description: "Location of the job."
      - name: source_platform
        description: "Job listing platform, with the leading 'via' prefix removed."
      - name: job_posted_at
        description: "Date or relative date when the job was posted."
      - name: currency
        description: "Currency extracted from the salary field, defaulting to USD."
      - name: salary_period
        description: "Salary interval, such as year, month, week, day, or hour."
      - name: salary_range
        description: "Salary range with non-numeric formatting removed."
      - name: salary_min
        description: "Minimum salary parsed from the salary range."
        data_tests:
          - not_negative
      - name: salary_max
        description: "Maximum salary parsed from the salary range."
        data_tests:
          - not_negative
      - name: job_schedule_type
        description: "Schedule type associated with the job posting."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Full-time', 'Part-time', 'Contract', 'Temporary', 'Internship', 'Commission', 'Volunteer', 'Other']
              config:
                severity: WARN ## Additional columns for enrichment as by default we have error and no models are built if any of the tests fail.
      - name: job_work_from_home
        description: "Whether the job supports working from home."
      - name: search_time
        description: "Timestamp when the job search was performed."
      - name: search_date
        description: "Date when the job search was performed."
      - name: search_term
        description: "Search term used to find the job posting."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Data Engineer', 'Data Scientist', 'Data Analyst', 'Machine Learning Engineer', 'Business Intelligence Analyst']
      - name: search_location
        description: "Location used to search for the job posting."
      - name: degree_mentioned
        description: "Whether the listing indicates that no degree is required."
      - name: has_health_insurance
        description: "Whether the job listing includes health insurance."
      - name: has_dental_insurance
        description: "Whether the job listing includes dental insurance."
      - name: has_paid_time_off
        description: "Whether the job listing includes paid time off."
  - name: stg_job_skills
    description: "Staged job skills with trimmed skill keywords."
    columns:
      - name: job_id
        description: "Identifier for the associated job posting."
        data_tests:
          - not_null
      - name: skill_id
        description: "Unique identifier for the skill."
      - name: skill_keyword
        description: "Trimmed keyword describing the skill."

unit_tests:
  - name: test_parse_salary_shape
    description: "Test to handle a range, a single value."
    model: stg_job_postings
    given:
      - input: source('jobs', 'raw_job_postings')
        rows: 
          - {job_id: 1, job_salary: "50,000 – 70,000 a year"}
          - {job_id: 2, job_salary: "60K a year"}
          - {job_id: 3, job_salary: "32.50 an hour"}
          - {job_id: 4, job_salary: "120K–160K a year"}
          - {job_id: 5, job_salary: null}
    expect:
      rows:
        - {job_id: 1, salary_min: 50000, salary_max: 70000}
        - {job_id: 2, salary_min: 60000, salary_max: 60000}
        - {job_id: 3, salary_min: 32.50, salary_max: 32.50}
        - {job_id: 4, salary_min: 120000, salary_max: 160000}
        - {job_id: 5, salary_min: null, salary_max: null}